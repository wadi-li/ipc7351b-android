name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk IPC7351B.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IPC7351B-apk
          path: IPC7351B.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: IPC-7351B v1.0 (build ${{ github.run_number }})
          body: "Справочник посадочных мест IPC-7351B — debug-сборка APK. Скачайте IPC7351B.apk на телефон и откройте (разрешите установку из неизвестных источников)."
          files: IPC7351B.apk
          make_latest: true
