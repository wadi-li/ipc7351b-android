name: Deploy PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Render PNG icons
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          mkdir -p docs/icons
          rsvg-convert -w 192 -h 192 docs/icon.svg -o docs/icons/icon-192.png
          rsvg-convert -w 512 -h 512 docs/icon.svg -o docs/icons/icon-512.png
          rsvg-convert -w 512 -h 512 docs/icon.svg -o docs/icons/maskable-512.png
          rsvg-convert -w 180 -h 180 docs/icon.svg -o docs/icons/apple-touch-icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
